{% assign protocol = include.href | strip | slice: 0, 4 %}
<a href="{% if protocol != 'http' %}//{% endif %}{{ include.href }}" target="_blank" rel="noopener" class="{{ include.class }}"{% if include.title %} title="{{ include.title | escape }}" data-tip="{{ include.title | escape }}"{% endif %} onclick="this.blur()">
