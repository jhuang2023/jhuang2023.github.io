<button
  type="button"
  class="lang-toggle no-print"
  id="lang-toggle"
  data-label-to-zh="{{ site.data.ui.en.lang_toggle_to_zh | escape }}"
  data-label-to-en="{{ site.data.ui.zh.lang_toggle_to_en | escape }}"
  aria-label="{{ site.data.ui.en.lang_toggle_to_zh | escape }}"
  title="{{ site.data.ui.en.lang_toggle_to_zh | escape }}"
>
  <span class="lang-toggle-label" data-i18n="en">中文</span>
  <span class="lang-toggle-label" data-i18n="zh">EN</span>
</button>
