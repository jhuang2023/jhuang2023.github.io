  github_username: jhuang2023
  linkedin_username: jujun-amy-huang

# All profile variants live in this file. Each view selects section IDs from
# `views` (pick only; no exclusive content). Sections that share a `group`
# are alternatives on normal pages (first selected wins). `/all/` shows every
# section without group dedupe, and annotates titles with path + duplicate tags.
#
# Each section's `tags` is documentation only (no template reads it): it lists
# exactly the view IDs whose `sections` include that section — `all` is never
# listed because that view renders every section. `tags: []` means the section
# is currently unpicked by every view. Keep `tags` in step with `views`.
selection:
  strategy: first-section-per-group

about:
  title: About Me
  profile_image: images/jhuang_img.jpg
  content: |
    I am an Assistant Professor of Management Information Systems in the School of Management at Binghamton University, SUNY. My research draws on design science, data science, and large language models (LLMs) to study financial disclosure, AI-assisted communication, and trust in AI, with applications in FinTech and social media analytics.

    I hold a Ph.D. in Business Administration (Information Systems concentration) and an M.S. in Business Intelligence & Analytics from Stevens Institute of Technology, and a Bachelor of Management from Shanghai University of International Business and Economics.

