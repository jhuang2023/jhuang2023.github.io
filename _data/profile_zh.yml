# 每个 section 的 `tags` 仅作说明用途（模板不读取）：它精确列出 `views` 中
# 引用了该 section 的视图 ID；`all` 视图渲染全部 section，因此不列入。
# `tags: []` 表示当前没有任何视图选用该 section。修改 `views` 时请同步 `tags`。

selection:
  strategy: first-section-per-group

about:
  title: 关于我
  profile_image: images/jhuang_img.jpg
  content: |
    我是纽约州立大学宾汉姆顿分校（Binghamton University, SUNY）管理学院的管理信息系统助理教授。我的研究结合设计科学、数据科学与大语言模型（LLMs），关注财务信息披露、AI 辅助沟通，以及公众对人工智能的信任问题，并将其应用于金融科技（FinTech）与社交媒体分析领域。

    我在史蒂文斯理工学院（Stevens Institute of Technology）获得工商管理博士学位（信息系统方向）和商业智能与分析硕士学位，本科毕业于上海对外经贸大学，获管理学学士学位。

